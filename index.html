<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wallet Transaction Dashboard</title>
<style>
:root {
--bg-color: #0f172a;
--card-bg: #1e293b;
--text-color: #f8fafc;
--text-secondary: #94a3b8;
--accent-color: #10b981;
--danger-color: #ef4444;
--border-color: #334155;
}
body {
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
background-color: var(--bg-color);
color: var(--text-color);
margin: 0;
padding: 16px;
}
.container {
max-width: 600px;
margin: 0 auto;
}
header {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 20px;
background: var(--card-bg);
padding: 12px 16px;
border-radius: 12px;
border: 1px solid var(--border-color);
}
h1 {
font-size: 1.1rem;
margin: 0;
}
button {
background: var(--accent-color);
color: white;
border: none;
padding: 8px 14px;
border-radius: 6px;
font-weight: bold;
cursor: pointer;
}
button.secondary {
background: var(--border-color);
}
.card {
background: var(--card-bg);
padding: 16px;
border-radius: 12px;
border: 1px solid var(--border-color);
margin-bottom: 16px;
}
table {
width: 100%;
border-collapse: collapse;
margin-top: 10px;
}
th, td {
padding: 10px;
text-align: left;
border-bottom: 1px solid var(--border-color);
font-size: 0.9rem;
}
th {
color: var(--text-secondary);
}
.form-group {
margin-bottom: 12px;
}
label {
display: block;
margin-bottom: 4px;
font-size: 0.85rem;
color: var(--text-secondary);
}
input, select {
width: 100%;
padding: 10px;
background: var(--bg-color);
border: 1px solid var(--border-color);
color: var(--text-color);
border-radius: 6px;
box-sizing: border-box;
}
.hidden {
display: none !important;
}
.flex-row {
display: flex;
gap: 10px;
}
</style>
</head>
<body>

<div class="container">
<header>
<h1 id="role-title">Viewer Mode</h1>
<div>
<button id="auth-btn" onclick="handleAuth()">Admin Login</button>
</div>
</header>

<!-- Admin Form Section -->
<div id="admin-section" class="card hidden">
<h3>Add New Transaction</h3>
<div class="form-group">
<label>Wallet / Number</label>
<input type="text" id="wallet" placeholder="e.g. bKash - 017xxxxxxxx">
</div>
<div class="form-group">
<label>Type</label>
<select id="type">
<option value="Deposit">Deposit</option>
<option value="Payout">Payout</option>
</select>
</div>
<div class="form-group">
<label>Amount</label>
<input type="number" id="amount" placeholder="Amount">
</div>
<button onclick="addTransaction()" style="width: 100%;">Save Transaction</button>

<hr style="border:0; border-top:1px solid var(--border-color); margin: 20px 0;">

<h3>Change Passcode</h3>
<div class="form-group">
<label>New Passcode</label>
<input type="password" id="new-pass" placeholder="Enter 4-digit code">
</div>
<button class="secondary" onclick="changePassword()" style="width: 100%;">Update Password</button>
</div>

<!-- Transactions List Section -->
<div class="card">
<h3>TODAY WALLET TRANSACTIONS</h3>
<table>
<thead>
<tr>
<th>Wallet / Number</th>
<th>Type</th>
<th>Today Total</th>
<th class="admin-col hidden">Action</th>
</tr>
​</thead>
<tbody id="tx-list">
<tr><td colspan="4" style="text-align: center; color: var(--text-secondary);">No transactions yet</td></tr>
</tbody>
</table>
</div>
</div>

<script>
// Initial data setup
if (!localStorage.getItem('admin_pass')) {
localStorage.setItem('admin_pass', '1234');
}
if (!localStorage.getItem('transactions')) {
localStorage.setItem('transactions', JSON.stringify([]));
}

let isAdmin = localStorage.getItem('is_admin') === 'true';

function render() {
const authBtn = document.getElementById('auth-btn');
const roleTitle = document.getElementById('role-title');
const adminSection = document.getElementById('admin-section');
const adminCols = document.querySelectorAll('.admin-col');

if (isAdmin) {
roleTitle.innerText = "Admin Mode";
authBtn.innerText = "Logout";
adminSection.classList.remove('hidden');
adminCols.forEach(col => col.classList.remove('hidden'));
} else {
roleTitle.innerText = "Viewer Mode";
authBtn.innerText = "Admin Login";
adminSection.classList.add('hidden');
adminCols.forEach(col => col.classList.add('hidden'));
}

const txs = JSON.parse(localStorage.getItem('transactions')) || [];
const tbody = document.getElementById('tx-list');

if (txs.length === 0) {
tbody.innerHTML = <tr&gt;&lt;td colspan="4" style="text-align: center; color: var(--text-secondary);"&gt;No transactions yet&lt;/td&gt;&lt;/tr>;
return;
}

tbody.innerHTML = '';
txs.forEach((tx, index) => {
let tr = document.createElement('tr');
tr.innerHTML = &lt;td&gt;${tx.wallet}</td>
<td style="color: ${tx.type === 'Deposit' ? '#10b981' : '#ef4444'}"&gt;${tx.type}</td>
<td>${tx.amount}&lt;/td&gt; &lt;td class="admin-col ${isAdmin ? '' : 'hidden'}">
<button onclick="deleteTx(${index})" style="background: var(--danger-color); padding: 4px 8px; font-size: 0.8rem;"&gt;Delete&lt;/button&gt; &lt;/td&gt;;
tbody.appendChild(tr);
});
}

function handleAuth() {
if (isAdmin) {
isAdmin = false;
localStorage.setItem('is_admin', 'false');
render();
} else {
let pass = prompt("Enter Admin Passcode:");
let savedPass = localStorage.getItem('admin_pass') || '1234';
if (pass === savedPass) {
isAdmin = true;
localStorage.setItem('is_admin', 'true');
render();
} else if (pass !== null) {
alert("Incorrect Password!");
}
}
}

function addTransaction() {
let wallet = document.getElementById('wallet').value.trim();
let type = document.getElementById('type').value;
let amount = document.getElementById('amount').value.trim();

if (!wallet || !amount) {
alert("Please fill in all fields");
return;
}

let txs = JSON.parse(localStorage.getItem('transactions')) || [];
txs.push({ wallet, type, amount });
localStorage.setItem('transactions', JSON.stringify(txs));

document.getElementById('wallet').value = '';
document.getElementById('amount').value = '';
render();
}

function deleteTx(index) {
if (confirm("Are you sure you want to delete this record?")) {
let txs = JSON.parse(localStorage.getItem('transactions')) || [];
txs.splice(index, 1);
localStorage.setItem('transactions', JSON.stringify(txs));
render();
}
}

function changePassword() {
let newPass = document.getElementById('new-pass').value.trim();
if (newPass.length < 3) {
alert("Password must be at least 3 characters long");
return;
}
localStorage.setItem('admin_pass', newPass);
document.getElementById('new-pass').value = '';
alert("Passcode updated successfully!");
}

// Initial Load
render();
</script>

</body>
</html>
